services:
  - type: web
    name: orders-explorer-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: FRONTEND_URL
        sync: false
      - key: SIMULATE_LATENCY
        value: "true"
      - key: SIMULATE_FAILURES
        value: "true"
